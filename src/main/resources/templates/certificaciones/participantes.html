<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Participantes')}"></head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='admin-certificaciones')}"></div>
        <main class="dashboard-content">
            <div style="max-width:720px;margin:0 auto;padding:var(--spacing-lg);">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1.5rem;flex-wrap:wrap;gap:0.75rem;">
                    <div style="font-size:0.875rem;color:var(--text-muted);">
                        <a href="/admin/certificaciones" th:href="@{/admin/certificaciones}" style="color:var(--color-accento);text-decoration:none;">Certificaciones</a>
                        / Participantes
                    </div>
                    <a href="/admin/certificaciones" th:href="@{/admin/certificaciones}" class="btn btn-secondary" style="display:flex;align-items:center;gap:0.375rem;">
                        <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
                        Volver
                    </a>
                </div>

                <h1 style="font-size:1.5rem;font-weight:600;margin-bottom:1.5rem;" th:text="'Participantes: ' + ${certificacion.titulo}">Participantes</h1>

                <div th:if="${mensajeExito}" style="padding:0.75rem 1rem;background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.2);border-radius:0.375rem;color:#15803d;font-size:0.875rem;margin-bottom:1rem;" th:text="${mensajeExito}"></div>
                <div th:if="${error}" style="padding:0.75rem 1rem;background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.2);border-radius:0.375rem;color:#b91c1c;font-size:0.875rem;margin-bottom:1rem;" th:text="${error}"></div>

                <!-- Individual -->
                <div class="card" style="margin-bottom:1.5rem;">
                    <div style="padding:var(--spacing-lg) var(--spacing-xl);border-bottom:1px solid var(--border-default);">
                        <h2 style="font-size:1rem;font-weight:600;">Inscribir Usuario</h2>
                    </div>
                    <div style="padding:var(--spacing-xl);">
                        <form th:action="@{/admin/certificaciones/{id}/inscribir(id=${certificacion.id})}" method="post" style="display:flex;gap:0.75rem;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="text" name="usuarioId" required placeholder="RUT o email del usuario"
                                   style="flex:1;padding:0.5rem 0.75rem;border:1px solid var(--border-default);border-radius:0.375rem;font-size:0.9375rem;">
                            <button type="submit" class="btn btn-primary">Inscribir</button>
                        </form>
                    </div>
                </div>

                <!-- Bulk -->
                <div class="card" style="margin-bottom:1.5rem;" sec:authorize="hasAnyRole('SUPERADMIN')">
                    <div style="padding:var(--spacing-lg) var(--spacing-xl);border-bottom:1px solid var(--border-default);">
                        <h2 style="font-size:1rem;font-weight:600;">Carga Masiva (CSV)</h2>
                    </div>
                    <div style="padding:var(--spacing-xl);">
                        <form th:action="@{/admin/certificaciones/{id}/inscribir-masivo(id=${certificacion.id})}" method="post" enctype="multipart/form-data" style="display:flex;gap:0.75rem;align-items:center;">
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                            <input type="file" name="archivo" accept=".csv" style="flex:1;font-size:0.875rem;">
                            <button type="submit" class="btn btn-accent">Subir</button>
                        </form>
                        <p style="font-size:0.75rem;color:var(--text-muted);margin-top:0.5rem;">CSV con una columna: RUT o email por línea.</p>
                        <div th:if="${reporte}" style="margin-top:0.75rem;padding:0.75rem;background:rgba(34,197,94,0.05);border-radius:0.375rem;font-size:0.8125rem;">
                            <p><strong>Resultado:</strong> <span th:text="${reporte.exitosos}"></span> exitosos, <span th:text="${reporte.noEncontrados}"></span> no encontrados, <span th:text="${reporte.yaInscritos}"></span> ya inscritos, <span th:text="${reporte.errores}"></span> errores.</p>
                        </div>
                    </div>
                </div>

                <!-- List -->
                <div class="card">
                    <div style="padding:var(--spacing-lg) var(--spacing-xl);border-bottom:1px solid var(--border-default);">
                        <h2 style="font-size:1rem;font-weight:600;">Inscritos</h2>
                    </div>
                    <div style="padding:var(--spacing-xl);">
                        <div th:if="${#lists.isEmpty(inscritos)}" style="text-align:center;padding:1rem;color:var(--text-muted);font-size:0.875rem;">No hay usuarios inscritos.</div>
                        <div th:unless="${#lists.isEmpty(inscritos)}" style="display:flex;flex-direction:column;gap:0.5rem;">
                            <div th:each="i : ${inscritos}" style="display:flex;align-items:center;justify-content:space-between;padding:0.5rem 0.75rem;background:var(--bg-body);border-radius:0.375rem;border:1px solid var(--border-default);">
                                <div style="display:flex;align-items:center;gap:0.75rem;">
                                    <div style="width:2rem;height:2rem;border-radius:50%;background:rgba(99,102,241,0.1);display:flex;align-items:center;justify-content:center;color:#6366f1;font-size:0.75rem;font-weight:600;" th:text="${#strings.substring(i.usuario.email, 0, 2).toUpperCase()}">AB</div>
                                    <div>
                                        <div style="font-weight:500;font-size:0.8125rem;color:var(--text-primary);" th:text="${i.usuario.nombreCompleto}">Nombre</div>
                                        <div style="font-size:0.75rem;color:var(--text-muted);" th:text="${i.usuario.email}">email</div>
                                    </div>
                                </div>
                                <div style="display:flex;align-items:center;gap:0.5rem;">
                                    <span th:if="${i.completado}" style="font-size:0.75rem;padding:0.125rem 0.5rem;border-radius:0.25rem;background:rgba(34,197,94,0.1);color:#15803d;font-weight:500;" th:text="'Nota: ' + ${i.nota}">Nota</span>
                                    <form th:action="@{/admin/certificaciones/{cid}/inscribir/{uid}/remover(cid=${certificacion.id},uid=${i.usuario.id})}" method="post" style="display:inline;margin:0;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" style="background:none;border:1px solid var(--color-danger);color:var(--color-danger);border-radius:0.375rem;padding:0.25rem 0.625rem;cursor:pointer;font-size:0.75rem;font-weight:500;">Revocar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
