<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Mis Certificaciones')}"></head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='certificaciones')}"></div>
        <main class="dashboard-content">
            <div style="max-width:var(--container-max);margin:0 auto;padding:var(--spacing-lg);">
                <div class="dashboard-page-header animate-fade-in">
                    <div>
                        <h1 class="dashboard-page-title">Mis Certificaciones</h1>
                        <p style="color:var(--text-secondary);font-size:var(--font-size-sm);margin-top:var(--spacing-xs);">Certificaciones disponibles para ti</p>
                    </div>
                    <a href="/admin/certificaciones/crear" class="btn btn-accent" style="display:inline-flex;align-items:center;gap:0.5rem;" sec:authorize="hasAnyRole('SUPERADMIN')">
                        <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                        Nueva Certificación
                    </a>
                </div>

                <div class="card animate-slide-up">
                    <div style="padding:var(--spacing-xl);">
                        <div th:if="${#lists.isEmpty(certificaciones)}" style="text-align:center;padding:3rem 1rem;color:var(--text-muted);">
                            <svg style="width:3rem;height:3rem;margin:0 auto 1rem;opacity:0.3;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <p style="font-size:1rem;font-weight:500;margin-bottom:0.5rem;">No tienes certificaciones asignadas</p>
                        </div>
                        <div th:unless="${#lists.isEmpty(certificaciones)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem;">
                            <div th:each="c : ${certificaciones}" style="display:flex;flex-direction:column;background:var(--bg-body);border:1px solid var(--border-default);border-radius:0.75rem;padding:1.25rem;">
                                <div style="display:flex;align-items:center;gap:0.75rem;margin-bottom:0.75rem;">
                                    <div style="width:2.5rem;height:2.5rem;border-radius:0.5rem;background:rgba(99,102,241,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                        <svg style="width:1.25rem;height:1.25rem;color:#6366f1;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                                    </div>
                                    <div style="flex:1;min-width:0;">
                                        <div style="font-weight:600;font-size:1rem;color:var(--text-primary);" th:text="${c.titulo}">Certificación</div>
                                        <div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.125rem;" th:text="${c.descripcion}">Descripción</div>
                                    </div>
                                </div>
                                <div th:if="${ultimosIntentos.containsKey(c.id)}" style="margin-bottom:0.75rem;padding:0.5rem 0.75rem;border-radius:0.5rem;font-size:0.8125rem;display:flex;align-items:center;justify-content:space-between;"
                                     th:style="${ultimosIntentos.get(c.id).aprobado != null and ultimosIntentos.get(c.id).aprobado ? 'background:rgba(34,197,94,0.08);border:1px solid rgba(34,197,94,0.15);color:#15803d;' : 'background:rgba(239,68,68,0.08);border:1px solid rgba(239,68,68,0.15);color:#b91c1c;'}">
                                    <span th:text="${ultimosIntentos.get(c.id).aprobado != null and ultimosIntentos.get(c.id).aprobado ? '✅ Aprobado' : '❌ Reprobado'}">Estado</span>
                                    <span style="font-weight:700;" th:text="'Nota: ' + ${#numbers.formatDecimal(ultimosIntentos.get(c.id).nota, 1, 1)} + '%'">Nota</span>
                                </div>
                                <div style="margin-top:auto;display:flex;gap:0.5rem;justify-content:flex-end;">
                                    <a th:href="@{/admin/certificaciones/{id}/editar(id=${c.id})}" class="btn btn-secondary" style="display:inline-flex;align-items:center;gap:0.25rem;font-size:0.75rem;padding:0.25rem 0.625rem;text-decoration:none;" sec:authorize="hasAnyRole('SUPERADMIN')">Editar</a>
                                    <a th:href="@{/admin/certificaciones/{id}/participantes(id=${c.id})}" class="btn btn-secondary" style="display:inline-flex;align-items:center;gap:0.25rem;font-size:0.75rem;padding:0.25rem 0.625rem;text-decoration:none;" sec:authorize="hasAnyRole('SUPERADMIN')">Inscribir</a>
                                    <a th:href="@{/certificaciones/{id}/rendir(id=${c.id})}" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:0.375rem;font-size:0.8125rem;padding:0.375rem 0.75rem;">
                                        <svg style="width:0.875rem;height:0.875rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.25 5.653c0-.856.917-1.398 1.667-.986l11.54 6.348a1.125 1.125 0 010 1.971l-11.54 6.347a1.125 1.125 0 01-1.667-.985V5.653z"/></svg>
                                        <span th:text="${ultimosIntentos.containsKey(c.id) ? 'Ver Resultado' : 'Rendir'}">Rendir</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
