<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Certificaciones')}"></head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='admin-certificaciones')}"></div>
        <main class="dashboard-content">
            <div style="max-width:var(--container-max);margin:0 auto;padding:var(--spacing-lg);">
                <div class="dashboard-page-header animate-fade-in">
                    <div>
                        <h1 class="dashboard-page-title">Certificaciones</h1>
                        <p style="color:var(--text-secondary);font-size:var(--font-size-sm);margin-top:var(--spacing-xs);">Gestiona certificaciones independientes</p>
                    </div>
                    <a href="/admin/certificaciones/crear" class="btn btn-accent" style="display:inline-flex;align-items:center;gap:0.5rem;">
                        <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                        Nueva Certificación
                    </a>
                </div>

                <div style="display:flex;justify-content:flex-end;margin-bottom:var(--spacing-sm);">
                    <form method="get" action="/admin/certificaciones" style="display:flex;align-items:center;gap:0.5rem;">
                        <label style="font-size:0.8125rem;color:var(--text-muted);">Ordenar por:</label>
                        <select name="sort" onchange="this.form.submit()"
                                style="padding:0.375rem 0.625rem;border:1px solid var(--border-default);border-radius:0.375rem;font-size:0.8125rem;background:var(--bg-body);color:var(--text-primary);cursor:pointer;">
                            <option value="titulo" th:selected="${sort == 'titulo'}">Título A-Z</option>
                            <option value="titulo_desc" th:selected="${sort == 'titulo_desc'}">Título Z-A</option>
                            <option value="codigo" th:selected="${sort == 'codigo'}">Código</option>
                            <option value="fecha" th:selected="${sort == 'fecha'}">Más antiguo</option>
                            <option value="fecha_desc" th:selected="${sort == 'fecha_desc'}">Más reciente</option>
                        </select>
                    </form>
                </div>

                <div class="card animate-slide-up">
                    <div style="padding:var(--spacing-xl);">
                        <div th:if="${#lists.isEmpty(certificaciones)}" style="text-align:center;padding:3rem 1rem;color:var(--text-muted);">
                            <svg style="width:3rem;height:3rem;margin:0 auto 1rem;opacity:0.3;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <p style="font-size:1rem;font-weight:500;margin-bottom:0.5rem;">No hay certificaciones</p>
                            <p style="font-size:0.875rem;">Crea la primera certificación para empezar.</p>
                        </div>
                        <div th:unless="${#lists.isEmpty(certificaciones)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;">
                            <div th:each="c : ${certificaciones}" style="display:flex;flex-direction:column;background:var(--bg-body);border:1px solid var(--border-default);border-radius:0.75rem;">
                                <a th:href="@{/admin/certificaciones/{id}/editar(id=${c.id})}" style="display:flex;align-items:center;gap:1rem;padding:1.25rem 1.25rem 0.75rem;text-decoration:none;min-width:0;">
                                    <div style="width:2.5rem;height:2.5rem;border-radius:0.5rem;background:rgba(99,102,241,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                        <svg style="width:1.25rem;height:1.25rem;color:#6366f1;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
                                    </div>
                                    <div style="min-width:0;flex:1;">
                                        <div style="font-weight:600;font-size:1rem;color:var(--text-primary);" th:text="${c.titulo}">Nombre</div>
                                        <div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.125rem;" th:text="'Código: ' + ${c.codigo}">Código</div>
                                    </div>
                                </a>
                                <div style="display:flex;gap:0.5rem;padding:0.5rem 1.25rem 1rem;border-top:1px solid var(--border-default);justify-content:flex-end;">
                                    <a th:href="@{/admin/certificaciones/{id}/editar(id=${c.id})}" style="display:inline-flex;align-items:center;gap:0.25rem;background:none;border:1px solid var(--text-secondary);color:var(--text-secondary);border-radius:0.375rem;padding:0.375rem 0.75rem;cursor:pointer;font-size:0.75rem;font-weight:500;text-decoration:none;">
                                        <svg style="width:0.75rem;height:0.75rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125"/></svg>
                                        Editar
                                    </a>
                                    <a th:href="@{/admin/certificaciones/{id}/participantes(id=${c.id})}" style="display:inline-flex;align-items:center;gap:0.25rem;background:none;border:1px solid var(--color-accento);color:var(--color-accento);border-radius:0.375rem;padding:0.375rem 0.75rem;cursor:pointer;font-size:0.75rem;font-weight:500;text-decoration:none;">
                                        <svg style="width:0.75rem;height:0.75rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19.128a9.38 9.38 0 002.625.372 9.337 9.337 0 004.121-.952 4.125 4.125 0 00-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 018.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0111.964-3.07M12 6.375a3.375 3.375 0 11-6.75 0 3.375 3.375 0 016.75 0zm8.25 2.25a2.625 2.625 0 11-5.25 0 2.625 2.625 0 015.25 0z"/></svg>
                                        Participantes
                                    </a>
                                    <button type="button" th:attr="data-id=${c.id}" onclick="eliminarCertificacion(this)" style="display:inline-flex;align-items:center;gap:0.25rem;background:none;border:1px solid var(--color-danger);color:var(--color-danger);border-radius:0.375rem;padding:0.375rem 0.75rem;cursor:pointer;font-size:0.75rem;font-weight:500;">
                                        <svg style="width:0.75rem;height:0.75rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                                        Eliminar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
    <script>
        function eliminarCertificacion(btn) {
            var id = btn.getAttribute('data-id');
            if (!id) return;
            if (!confirm('¿Eliminar certificación?')) return;
            var csrfToken = document.querySelector('meta[name="_csrf"]').getAttribute('content');
            var csrfHeader = document.querySelector('meta[name="_csrf_header"]').getAttribute('content');
            fetch('/api/v1/certificaciones/' + id, {
                method: 'DELETE',
                headers: { [csrfHeader]: csrfToken }
            }).then(function(r) {
                if (r.ok) { window.location.reload(); }
                else { r.json().then(function(e) { alert('Error: ' + (e.message || 'No se pudo eliminar')); }); }
            }).catch(function(e) { alert('Error: ' + e.message); });
        }
    </script>
</body>
</html>
