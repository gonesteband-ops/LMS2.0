<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<div th:fragment="detalle">
    <div id="modal-pub-backdrop" style="position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem;" onclick="if(event.target===this)this.remove()">
        <div id="modal-pub" style="background:var(--bg-surface);border-radius:1rem;max-width:720px;width:100%;max-height:90vh;overflow-y:auto;box-shadow:0 25px 50px rgba(0,0,0,0.25);animation:modalIn 0.2s ease;">
            <div style="padding:1.25rem 1.5rem;border-bottom:1px solid var(--border-default);display:flex;justify-content:space-between;align-items:center;">
                <h2 style="font-size:1.125rem;font-weight:600;color:var(--text-primary);margin:0;" th:text="${pub.titulo}">Título</h2>
                <button onclick="document.getElementById('modal-pub-backdrop').remove()" style="background:none;border:none;cursor:pointer;color:var(--text-muted);padding:0.25rem;">
                    <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <div style="padding:1.5rem;">
                <div th:if="${pub.descripcionCorta != null and !pub.descripcionCorta.isEmpty()}" style="font-size:0.9375rem;color:var(--text-secondary);margin-bottom:1rem;line-height:1.5;" th:text="${pub.descripcionCorta}">Descripción</div>
                <div style="font-size:0.9375rem;color:var(--text-primary);line-height:1.6;" th:utext="${pub.contenidoHtml}">Contenido</div>
                <div th:if="${pub.archivoNombre != null and !pub.archivoNombre.isEmpty()}" style="margin-top:1.5rem;padding-top:1rem;border-top:1px solid var(--border-default);">
                    <div style="display:flex;align-items:center;justify-content:space-between;padding:0.75rem 1rem;background:var(--bg-body);border-radius:0.5rem;border:1px solid var(--border-default);">
                        <div style="display:flex;align-items:center;gap:0.75rem;">
                            <svg style="width:1.5rem;height:1.5rem;color:var(--color-accento);flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M18.375 12.739l-7.693 7.693a4.5 4.5 0 01-6.364-6.364l10.94-10.94A3 3 0 1119.5 7.372L8.552 18.32m.009-.01l-.01.01m5.699-9.941l-7.81 7.81a1.5 1.5 0 002.112 2.13"/></svg>
                            <span style="font-size:0.875rem;font-weight:500;color:var(--text-primary);" th:text="${pub.archivoNombre}">archivo.pdf</span>
                        </div>
                        <a th:href="${pub.archivoUrl}" target="_blank" rel="noopener" class="btn btn-accent" style="display:inline-flex;align-items:center;gap:0.375rem;padding:0.375rem 0.75rem;font-size:0.8125rem;text-decoration:none;">
                            <svg style="width:0.875rem;height:0.875rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/></svg>
                            Descargar
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <style>
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</div>
</body>
</html>
