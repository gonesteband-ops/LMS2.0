<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Gestor de Contenidos')}"></head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='bpo-contenidos')}"></div>
        <main class="dashboard-content">
            <div class="bpo-container">
                <h1 class="bpo-titulo">Gestor de Contenidos</h1>

                <div id="tarjetas-resumen"
                     hx-get="/bpo/contenidos/tarjetas"
                     hx-trigger="load"
                     hx-target="#tarjetas-resumen"
                     hx-swap="innerHTML">
                </div>

                <div class="bpo-busqueda">
                    <input type="text" id="bpo-search" class="bpo-search-input"
                           placeholder="Buscar procedimientos, ofertas, noticias..."
                           hx-get="/bpo/contenidos/lista"
                           hx-trigger="keyup changed delay:500ms"
                           hx-target="#bpo-lista-contenidos"
                           hx-include="[name='tipo']"
                           hx-swap="innerHTML"
                           name="q">
                    <select id="bpo-filtro-tipo" class="bpo-filtro-select"
                            hx-get="/bpo/contenidos/lista"
                            hx-trigger="change"
                            hx-target="#bpo-lista-contenidos"
                            hx-include="[name='q']"
                            hx-swap="innerHTML"
                            name="tipo">
                        <option value="">Todos los tipos</option>
                        <option value="procedimiento">Procedimientos</option>
                        <option value="noticia">Noticias</option>
                        <option value="oferta">Ofertas</option>
                    </select>
                </div>

                <div id="bpo-lista-contenidos"
                     hx-get="/bpo/contenidos/lista"
                     hx-trigger="load"
                     hx-target="#bpo-lista-contenidos"
                     hx-swap="innerHTML">
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
