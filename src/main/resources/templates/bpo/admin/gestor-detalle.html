<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Gestor')}"></head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='admin-bpo-contenidos')}"></div>
        <main class="dashboard-content">
            <div style="max-width:var(--container-max);margin:0 auto;padding:var(--spacing-lg);">
                <div class="dashboard-page-header animate-fade-in">
                    <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                        <div>
                            <h1 class="dashboard-page-title" th:text="${gestor.nombre}">Gestor</h1>
                            <p style="color:var(--text-secondary);font-size:var(--font-size-sm);margin-top:var(--spacing-xs);">Subcarpetas y publicaciones del gestor</p>
                        </div>
                        <div style="display:flex;gap:0.75rem;flex-wrap:wrap;">
                            <a href="/admin/bpo/gestores" th:href="@{/admin/bpo/gestores/{id}/subcarpetas/nuevo(id=${gestor.codigo})}" class="btn btn-primary" style="display:flex;align-items:center;gap:0.5rem;">
                                <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
                                Crear nueva carpeta
                            </a>
                            <a href="/admin/bpo/gestores" th:href="@{/admin/bpo/gestores/{id}/editar(id=${gestor.codigo})}" class="btn btn-primary" style="display:flex;align-items:center;gap:0.5rem;">
                                <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
                                Editar Gestor
                            </a>
                            <a href="/admin/bpo/gestores" th:href="@{/admin/bpo/gestores}" class="btn btn-primary" style="display:flex;align-items:center;gap:0.5rem;">
                                <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
                                Volver
                            </a>
                        </div>
                    </div>
                </div>

                <div class="card animate-slide-up">
                    <div style="padding:var(--spacing-xl);">
                        <div th:if="${#lists.isEmpty(subcarpetas)}" style="text-align:center;padding:2rem;color:var(--text-muted);">
                            <p style="font-size:0.875rem;">No hay subcarpetas en este gestor.</p>
                        </div>
                        <div th:unless="${#lists.isEmpty(subcarpetas)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem;">
                            <div th:each="s : ${subcarpetas}"
                                 style="display:flex;align-items:center;gap:0.75rem;background:var(--bg-body);border:1px solid var(--border-default);border-radius:0.5rem;padding:1rem;">
                                <a th:href="@{/admin/bpo/gestores/{gid}/subcarpetas/{sid}(gid=${gestor.codigo},sid=${s.codigo})}"
                                   style="display:flex;align-items:center;gap:0.75rem;flex:1;text-decoration:none;min-width:0;">
                                    <div style="width:2rem;height:2rem;border-radius:0.375rem;background:rgba(245,158,11,0.08);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                        <svg style="width:1rem;height:1rem;color:var(--color-accento);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                                    </div>
                                    <div style="min-width:0;flex:1;">
                                        <div style="font-weight:500;color:var(--text-primary);" th:text="${s.nombre}">Subcarpeta</div>
                                        <div style="font-size:0.75rem;color:var(--text-muted);">Ver publicaciones</div>
                                    </div>
                                    <svg style="width:1rem;height:1rem;color:var(--text-muted);flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                                </a>
                                <div style="display:flex;gap:0.375rem;flex-shrink:0;">
                                    <a th:href="@{/admin/bpo/gestores/{gid}/subcarpetas/{sid}/editar(gid=${gestor.codigo},sid=${s.codigo})}"
                                       style="background:none;border:1px solid var(--text-secondary);color:var(--text-secondary);border-radius:0.375rem;padding:0.25rem 0.625rem;cursor:pointer;font-size:0.75rem;font-weight:500;text-decoration:none;">Editar</a>
                                    <form th:action="@{/admin/bpo/gestores/{gid}/subcarpetas/{sid}/eliminar(gid=${gestor.codigo},sid=${s.codigo})}" method="post" style="display:inline;" onsubmit="return confirm('¿Eliminar carpeta \'' + '${s.nombre}' + '\'?');">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" style="background:none;border:1px solid var(--color-danger);color:var(--color-danger);border-radius:0.375rem;padding:0.25rem 0.625rem;cursor:pointer;font-size:0.75rem;font-weight:500;">Eliminar</button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
