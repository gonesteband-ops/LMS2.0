<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Gestor de Contenidos')}"></head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>
    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='bpo-gestores')}"></div>
        <main class="dashboard-content">
            <div style="max-width:var(--container-max);margin:0 auto;padding:var(--spacing-lg);">
                <div class="dashboard-page-header animate-fade-in">
                    <div style="display:flex;justify-content:space-between;align-items:center;width:100%;">
                        <div>
                            <h1 class="dashboard-page-title">Gestor de Contenidos</h1>
                            <p style="color:var(--text-secondary);font-size:var(--font-size-sm);margin-top:var(--spacing-xs);">Explora los gestores compartidos contigo</p>
                        </div>
                        <div sec:authorize="hasAnyRole('SUPERADMIN', 'ADMIN')">
                            <a href="/admin/bpo/gestores/nuevo" class="btn btn-primary" style="display:inline-flex;align-items:center;gap:0.5rem;">
                                <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.5v15m7.5-7.5h-15"/></svg>
                                Nuevo Gestor
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Buscador tipo Google con HTMX instantáneo -->
                <div class="card animate-slide-up" style="margin-bottom:var(--spacing-xl);">
                    <div style="padding:var(--spacing-md) var(--spacing-xl);">
                        <div style="display:flex;gap:0.75rem;">
                            <div style="position:relative;flex:1;">
                                <div style="position:absolute;left:0.875rem;top:50%;transform:translateY(-50%);color:var(--text-muted);pointer-events:none;">
                                    <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
                                </div>
                                <input type="search" name="q" autocomplete="off"
                                       placeholder="Buscar gestores, publicaciones..."
                                       style="width:100%;padding:0.75rem 1rem 0.75rem 2.75rem;border:1px solid var(--border-default);border-radius:2rem;font-size:0.9375rem;background:var(--bg-body);color:var(--text-primary);outline:none;"
                                       onfocus="this.style.borderColor='var(--color-accento)';this.style.boxShadow='0 0 0 3px rgba(245,158,11,0.12)'"
                                       onblur="this.style.borderColor='';this.style.boxShadow=''"
                                       hx-get="/bpo/gestores"
                                       hx-trigger="keyup changed delay:300ms, search"
                                       hx-target="#gestores-list"
                                       hx-select="#gestores-list"
                                       hx-swap="outerHTML"
                                       hx-indicator="#search-spinner">
                            </div>
                            <span id="search-spinner" class="htmx-indicator" style="align-self:center;width:1.25rem;height:1.25rem;border:2px solid var(--border-default);border-top-color:var(--color-accento);border-radius:50%;animation:spin 0.6s linear infinite;"></span>
                        </div>
                    </div>
                </div>

                <!-- Sort options -->
                <div style="display:flex;justify-content:flex-end;margin-bottom:var(--spacing-sm);">
                    <form method="get" action="/bpo/gestores" style="display:flex;align-items:center;gap:0.5rem;">
                        <input type="hidden" name="q" th:value="${q}" />
                        <label style="font-size:0.8125rem;color:var(--text-muted);">Ordenar por:</label>
                        <select name="sort" onchange="this.form.submit()"
                                style="padding:0.375rem 0.625rem;border:1px solid var(--border-default);border-radius:0.375rem;font-size:0.8125rem;background:var(--bg-body);color:var(--text-primary);cursor:pointer;">
                            <option value="nombre" th:selected="${sort == 'nombre'}">Nombre A-Z</option>
                            <option value="nombre_desc" th:selected="${sort == 'nombre_desc'}">Nombre Z-A</option>
                            <option value="fecha" th:selected="${sort == 'fecha'}">Más antiguo</option>
                            <option value="fecha_desc" th:selected="${sort == 'fecha_desc'}">Más reciente</option>
                        </select>
                        <noscript><button type="submit" class="btn btn-secondary" style="padding:0.25rem 0.5rem;font-size:0.75rem;">Ir</button></noscript>
                    </form>
                </div>

                <!-- Lista de gestores -->
                <div class="card animate-slide-up">
                    <div id="gestores-list" style="padding:var(--spacing-xl);">
                        <div th:if="${#lists.isEmpty(gestores)}" style="text-align:center;padding:3rem 1rem;color:var(--text-muted);">
                            <svg style="width:3rem;height:3rem;margin:0 auto 1rem;opacity:0.3;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                            <p style="font-size:1rem;font-weight:500;margin-bottom:0.5rem;">No tienes gestores asignados</p>
                            <p style="font-size:0.875rem;">Solicita a tu administrador que te comparta un gestor de contenido.</p>
                        </div>
                        <div th:unless="${#lists.isEmpty(gestores)}" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:1rem;">
                             <div th:each="g : ${gestores}"
                                  th:style="${!g.activa} ? 'opacity:0.55;display:flex;flex-direction:column;background:var(--bg-body);border:1px solid var(--border-default);border-radius:0.75rem;text-decoration:none;transition:box-shadow 0.2s,border-color 0.2s;' : 'display:flex;flex-direction:column;background:var(--bg-body);border:1px solid var(--border-default);border-radius:0.75rem;text-decoration:none;transition:box-shadow 0.2s,border-color 0.2s;'"
                                 onmouseover="this.style.borderColor='var(--color-accento)';this.style.boxShadow='0 4px 12px rgba(0,0,0,0.08)'"
                                 onmouseout="this.style.borderColor='';this.style.boxShadow=''">
                                <a th:href="@{/bpo/gestores/{id}(id=${g.id})}" style="display:flex;align-items:center;gap:1rem;flex:1;text-decoration:none;min-width:0;padding:1.25rem 1.25rem 0.75rem 1.25rem;">
                                    <div style="width:2.5rem;height:2.5rem;border-radius:0.5rem;background:rgba(245,158,11,0.1);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
                                        <svg style="width:1.25rem;height:1.25rem;color:var(--color-accento);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.25 12.75V12A2.25 2.25 0 014.5 9.75h15A2.25 2.25 0 0121.75 12v.75m-8.69-6.44l-2.12-2.12a1.5 1.5 0 00-1.061-.44H4.5A2.25 2.25 0 002.25 6v12a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9a2.25 2.25 0 00-2.25-2.25h-5.379a1.5 1.5 0 01-1.06-.44z"/></svg>
                                    </div>
                                    <div style="min-width:0;flex:1;">
                                        <div style="font-weight:600;font-size:1rem;color:var(--text-primary);" th:text="${g.nombre}">Nombre</div>
                                        <div style="font-size:0.8125rem;color:var(--text-muted);margin-top:0.125rem;">Ver publicaciones y recursos</div>
                                    </div>
                                    <svg style="width:1rem;height:1rem;color:var(--text-muted);flex-shrink:0;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.25 4.5l7.5 7.5-7.5 7.5"/></svg>
                                </a>
                                <div sec:authorize="hasAnyRole('SUPERADMIN', 'ADMIN')" style="display:flex;align-items:center;gap:0.5rem;padding:0.5rem 1.25rem 1rem 1.25rem;border-top:1px solid var(--border-default);margin-top:0.25rem;flex-wrap:wrap;">
                                    <span th:if="${g.activa}" style="font-size:0.75rem;color:var(--color-success);display:flex;align-items:center;gap:0.25rem;">
                                        <span style="width:0.5rem;height:0.5rem;border-radius:50%;background:var(--color-success);display:inline-block;"></span>
                                        Activo
                                    </span>
                                    <span th:unless="${g.activa}" style="font-size:0.75rem;color:var(--text-muted);display:flex;align-items:center;gap:0.25rem;">
                                        <span style="width:0.5rem;height:0.5rem;border-radius:50%;background:var(--text-muted);display:inline-block;"></span>
                                        Inactivo
                                    </span>
                                    <a th:href="@{/admin/bpo/gestores/{id}/compartir(id=${g.codigo != null ? g.codigo : g.id})}"
                                       style="display:inline-flex;align-items:center;gap:0.25rem;background:none;border:1px solid var(--color-accento);color:var(--color-accento);border-radius:0.375rem;padding:0.25rem 0.5rem;cursor:pointer;font-size:0.75rem;font-weight:500;text-decoration:none;">
                                        Compartir
                                    </a>
                                    <a th:href="@{/admin/bpo/gestores/{id}/editar(id=${g.codigo != null ? g.codigo : g.id})}"
                                       style="display:inline-flex;align-items:center;gap:0.25rem;background:none;border:1px solid var(--text-secondary);color:var(--text-secondary);border-radius:0.375rem;padding:0.25rem 0.5rem;cursor:pointer;font-size:0.75rem;font-weight:500;text-decoration:none;">
                                        Editar
                                    </a>
                                    <form th:action="@{/admin/bpo/gestores/{id}/toggle-activa(id=${g.codigo != null ? g.codigo : g.id})}" method="post" style="display:inline;margin:0;">
                                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                                        <button type="submit" style="display:inline-flex;align-items:center;gap:0.25rem;background:none;border:1px solid var(--text-secondary);color:var(--text-secondary);border-radius:0.375rem;padding:0.25rem 0.5rem;cursor:pointer;font-size:0.75rem;font-weight:500;">
                                            <span th:text="${g.activa} ? 'Deshabilitar' : 'Habilitar'"></span>
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
