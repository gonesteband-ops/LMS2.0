<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="icon" href="data:,">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="LMS LegalTech - Sistema de Gestión de Aprendizaje con cumplimiento legal">
    <meta http-equiv="Content-Security-Policy"
          content="default-src 'self';
                 script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com;
                 style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
                 font-src 'self' https://fonts.gstatic.com;
                 img-src 'self' data:;
                 connect-src 'self';
                 form-action 'self';
                 base-uri 'self'">
    <title th:text="${titulo} + ' | LMS LegalTech'">LMS LegalTech</title>

    <!-- Estilos CSS Puros (sin frameworks) -->
    <link rel="stylesheet" th:href="@{/css/variables.css}">
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/layout.css}">
    <link rel="stylesheet" th:href="@{/css/components.css}">

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- HTMX (interacciones dinámicas del lado del servidor) -->
    <script src="/js/htmx.min.js" defer></script>

    <!-- CSRF Token -->
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">

    <!-- Configuración HTMX -->
    <script defer>
        document.addEventListener('DOMContentLoaded', function() {
            if (typeof htmx !== 'undefined') {
                htmx.config.defaultSwapStyle = 'innerHTML';
                htmx.config.globalIndicator = '#global-loading';

                document.body.addEventListener('htmx:configRequest', function(evt) {
                    if (evt.detail.verb === 'get') return;
                    var t = document.querySelector('meta[name="_csrf"]');
                    var h = document.querySelector('meta[name="_csrf_header"]');
                    if (!t || !h) return;
                    var tk = t.getAttribute('content');
                    var hd = h.getAttribute('content');
                    if (tk && hd) evt.detail.headers[hd] = tk;
                });

                htmx.config.defaultSwapStyle = 'innerHTML';
                htmx.config.globalIndicator = '#global-loading';

                document.body.addEventListener('htmx:configRequest', function(evt) {
                    if (evt.detail.verb === 'get') return;
                    var t = document.querySelector('meta[name="_csrf"]');
                    var h = document.querySelector('meta[name="_csrf_header"]');
                    if (!t || !h) return;
                    var tk = t.getAttribute('content');
                    var hd = h.getAttribute('content');
                    if (tk && hd) evt.detail.headers[hd] = tk;
                });
            }
        });
    </script>

    <!-- JavaScript vainilla (sin frameworks) -->
    <script src="/js/app.js" defer></script>

    <!-- Estilos críticos inline (mínimos necesarios antes de cargar CSS) -->
    <style>
        /* HTMX indicators */
        .htmx-indicator { opacity: 0; transition: opacity 200ms ease-in; }
        .htmx-request .htmx-indicator { opacity: 1; }
        .htmx-request.htmx-indicator { opacity: 1; }

        /* Input autofill override */
        input:-webkit-autofill,
        input:-webkit-autofill:hover,
        input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px white inset !important;
            -webkit-text-fill-color: #1e293b !important;
        }

        [data-theme="dark"] input:-webkit-autofill,
        [data-theme="dark"] input:-webkit-autofill:hover,
        [data-theme="dark"] input:-webkit-autofill:focus {
            -webkit-box-shadow: 0 0 0 30px #1e293b inset !important;
            -webkit-text-fill-color: #f1f5f9 !important;
        }

        /* Transición global para interactive elements */
        a, button, input, select, textarea { transition: all 0.2s ease; }

        /* Loading bar global */
        #global-loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, var(--color-accent, #f59e0b), var(--color-accent-light, #fbbf24));
            z-index: 9999;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }
        #global-loading.htmx-request {
            transform: scaleX(1);
        }
    </style>
</head>
</html>
