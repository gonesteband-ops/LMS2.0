<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<header th:fragment="header" class="header" role="banner">
    <div class="header-container">
        <!-- Logo -->
        <div class="header-left">
            <a th:href="@{/}" class="header-logo" aria-label="Ir al inicio">
                <span class="header-logo-icon">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                    </svg>
                </span>
                LMS <span style="color: var(--color-accento);">LegalTech</span>
            </a>

            <!-- Desktop Navigation -->
            <nav class="header-nav" aria-label="Navegación principal">
                <a th:href="@{/}" th:classappend="${currentRequestUri == '/' or currentRequestUri.startsWith('/?')} ? 'active' : ''">Inicio</a>
                <a th:href="@{/#caracteristicas}">Características</a>
            </nav>
        </div>

        <!-- Right Side -->
        <div class="header-right">
            <!-- Sidebar Toggle -->
            <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Toggle sidebar">
                <svg width="20" height="20" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"/>
                </svg>
            </button>

            <!-- Theme Toggle -->
            <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
                <svg class="theme-icon-sun" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                </svg>
                <svg class="theme-icon-moon" width="16" height="16" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="display:none;">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                </svg>
            </button>

            <!-- Notificaciones bell (solo autenticado) -->
            <div sec:authorize="isAuthenticated()" class="dropdown" style="display:flex;align-items:center;margin-right:var(--spacing-sm);">
                <div class="dropdown-trigger" style="cursor:pointer;position:relative;padding:var(--spacing-xs);border-radius:var(--border-radius-lg);transition:background 0.2s;display:flex;align-items:center;"
                     onmouseover="this.style.background='rgba(255,255,255,0.05)'" onmouseout="this.style.background='transparent'"
                     onclick="event.stopPropagation();var m=this.parentElement.querySelector('.dropdown-menu');if(m)m.classList.toggle('active');">
                    <svg style="width:1.25rem;height:1.25rem;color:var(--text-secondary);" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/>
                    </svg>
                    <span id="notif-bell-count" style="display:none;position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--color-danger);color:#fff;font-size:0.5rem;font-weight:700;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg-surface);">0</span>
                </div>
                <div class="dropdown-menu" style="right:0;left:auto;min-width:320px;max-width:400px;padding:0;">
                    <div style="padding:var(--spacing-sm) var(--spacing-md);border-bottom:1px solid var(--border-default);display:flex;align-items:center;justify-content:space-between;">
                        <span style="font-size:var(--font-size-xs);font-weight:700;color:var(--text-primary);">Notificaciones</span>
                        <a href="/dashboard/notificaciones" style="font-size:0.625rem;color:var(--color-accento);text-decoration:none;">Ver todas</a>
                    </div>
                    <div id="notif-dropdown-list" style="max-height:300px;overflow-y:auto;">
                        <div style="text-align:center;padding:var(--spacing-lg);color:var(--text-muted);font-size:var(--font-size-xs);">
                            <div class="spinner" style="width:1rem;height:1rem;border-width:2px;margin:0 auto var(--spacing-xs);"></div>
                            Cargando...
                        </div>
                    </div>
                    <div style="padding:var(--spacing-sm) var(--spacing-md);border-top:1px solid var(--border-default);text-align:center;">
                        <button onclick="event.stopPropagation();fetch('/api/v1/notificaciones/leer-todas', {method:'POST'}).then(function(){cargarNotifDropdown();if(window.actualizarContadorNoLeidas) actualizarContadorNoLeidas();});"
                                style="font-size:0.625rem;color:var(--text-muted);background:none;border:none;cursor:pointer;padding:0.25rem 0.5rem;border-radius:var(--border-radius-sm);">
                            Marcar todas como leídas
                        </button>
                    </div>
                </div>
            </div>

            <!-- No autenticado -->
            <div sec:authorize="!isAuthenticated()" class="header-actions" style="display:flex;align-items:center;gap:var(--spacing-sm);">
                <a th:href="@{/login}" class="btn btn-ghost">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                    </svg>
                    Iniciar Sesión
                </a>
                <a th:href="@{/registro}" class="btn btn-accent">
                    Registrarse
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7l5 5m0 0l-5 5m5-5H6"/>
                    </svg>
                </a>
            </div>

            <!-- Autenticado: Menú de usuario con dropdown -->
            <div sec:authorize="isAuthenticated()" class="dropdown" style="display:flex;align-items:center;">
                <div class="dropdown-trigger" style="cursor:pointer;">
                    <div class="header-user">
                        <div class="avatar" style="position:relative;">
                            <span th:text="${#authentication.principal.nombreCompleto != null ? #strings.substring(#authentication.principal.nombreCompleto, 0, 1).toUpperCase() : 'U'}"
                                  style="display:flex;align-items:center;justify-content:center;width:100%;height:100%;background:linear-gradient(135deg,var(--color-accento),var(--color-accento-light));color:white;font-weight:700;font-size:0.75rem;border-radius:50%;">
                                U
                            </span>
                            <!-- Indicador online (dot verde) -->
                            <span style="position:absolute;bottom:0;right:0;width:10px;height:10px;background:#22c55e;border:2px solid var(--bg-surface);border-radius:50%;"></span>
                        </div>
                        <span class="header-user-name" th:text="${#authentication.principal.nombreCompleto ?: 'Usuario'}">Usuario</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" style="color:var(--text-muted);">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </div>
                </div>

                <div class="dropdown-menu" style="right:0;left:auto;min-width:200px;">
                    <a th:href="@{/dashboard}" class="dropdown-item">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                        </svg>
                        Dashboard
                    </a>
                    <a th:href="@{/dashboard/perfil}" class="dropdown-item">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                        </svg>
                        Mi Perfil
                    </a>
                    <a th:href="@{/dashboard/documentos}" class="dropdown-item">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Documentos
                    </a>
                    <a th:href="@{/cursos/scorm}" class="dropdown-item" sec:authorize="hasAnyRole('SUPERADMIN', 'INSTRUCTOR')">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
                        </svg>
                        Biblioteca SCORM
                    </a>
                    <div class="dropdown-divider"></div>
                    <form th:action="@{/logout}" method="GET" style="margin:0;">
                        <button type="submit" class="dropdown-item" style="width:100%;border:none;background:none;cursor:pointer;color:var(--color-danger);">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                            </svg>
                            Cerrar Sesión
                        </button>
                    </form>
                </div>
            </div>

            <!-- Mobile menu toggle -->
            <button class="mobile-menu-toggle" onclick="toggleMobileMenu()" aria-label="Menú móvil">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </div>

    <!-- Mobile Navigation -->
    <div id="mobile-menu" class="mobile-menu-panel" style="display:none;">
        <nav style="display:flex;flex-direction:column;gap:var(--spacing-xs);padding:var(--spacing-md) var(--spacing-lg);">
            <a th:href="@{/}" style="padding:var(--spacing-sm) var(--spacing-md);border-radius:var(--border-radius-md);color:var(--text-secondary);font-size:var(--font-size-sm);font-weight:500;text-decoration:none;">Inicio</a>
            <a th:href="@{/#caracteristicas}" style="padding:var(--spacing-sm) var(--spacing-md);border-radius:var(--border-radius-md);color:var(--text-secondary);font-size:var(--font-size-sm);font-weight:500;text-decoration:none;">Características</a>

            <div sec:authorize="!isAuthenticated()" style="display:flex;flex-direction:column;gap:var(--spacing-sm);padding-top:var(--spacing-md);margin-top:var(--spacing-md);border-top:1px solid var(--border-default);">
                <a th:href="@{/login}" class="btn btn-secondary" style="width:100%;justify-content:center;">
                    Iniciar Sesión
                </a>
                <a th:href="@{/registro}" class="btn btn-accent" style="width:100%;justify-content:center;">
                    Registrarse
                </a>
            </div>

            <div sec:authorize="isAuthenticated()" style="display:flex;flex-direction:column;gap:var(--spacing-sm);padding-top:var(--spacing-md);margin-top:var(--spacing-md);border-top:1px solid var(--border-default);">
                <a th:href="@{/dashboard}" class="btn btn-ghost" style="width:100%;justify-content:flex-start;">
                    Dashboard
                </a>
                <a th:href="@{/dashboard/perfil}" class="btn btn-ghost" style="width:100%;justify-content:flex-start;">
                    Mi Perfil
                </a>
                <a th:href="@{/dashboard/notificaciones}" class="btn btn-ghost" style="width:100%;justify-content:flex-start;">
                    <svg style="width:1rem;height:1rem;margin-right:var(--spacing-sm);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
                    Notificaciones
                    <span id="mobile-notif-count" style="display:none;margin-left:auto;font-size:0.625rem;background:var(--color-danger);color:#fff;padding:0.125rem 0.375rem;border-radius:var(--border-radius-xl);">0</span>
                </a>
                <a th:href="@{/dashboard/documentos}" class="btn btn-ghost" style="width:100%;justify-content:flex-start;">
                    Documentos
                </a>
                <!-- Biblioteca SCORM only visible to admin/instructor/superadmin -->
                <form th:action="@{/logout}" method="GET" style="margin:0;">
                    <button type="submit" class="btn btn-ghost" style="width:100%;justify-content:flex-start;color:var(--color-danger);">
                        Cerrar Sesión
                    </button>
                </form>
            </div>
        </nav>
    </div>

    <script>
        (function() {
            // Cargar notificaciones no leídas en el dropdown del header
            window.cargarNotifDropdown = function() {
                var list = document.getElementById('notif-dropdown-list');
                if (!list) return;

                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/v1/notificaciones/no-leidas', true);
                xhr.onload = function() {
                    if (xhr.status !== 200) {
                        list.innerHTML = '<div style="text-align:center;padding:var(--spacing-lg);color:var(--text-muted);font-size:var(--font-size-xs);">Error al cargar</div>';
                        return;
                    }
                    try {
                        var notifs = JSON.parse(xhr.responseText);
                        if (!notifs || notifs.length === 0) {
                            list.innerHTML = '<div style="text-align:center;padding:var(--spacing-lg);color:var(--text-muted);font-size:var(--font-size-xs);">' +
                                '<svg style="width:1.5rem;height:1.5rem;margin:0 auto var(--spacing-xs);color:var(--text-muted);opacity:0.5;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>' +
                                '<p>No hay notificaciones nuevas</p></div>';
                            return;
                        }
                        var html = '';
                        var max = Math.min(notifs.length, 5);
                        for (var i = 0; i < max; i++) {
                            var n = notifs[i];
                            var iconColor = 'var(--text-muted)';
                            if (n.tipo === 'vencimiento') iconColor = 'rgba(180,83,9,1)';
                            else if (n.tipo === 'reprobacion') iconColor = 'var(--color-danger)';
                            else if (n.tipo === 'logro') iconColor = 'var(--color-success)';
                            else if (n.tipo === 'sistema') iconColor = 'var(--color-info)';

                            html += '<a href="/dashboard/notificaciones" style="display:flex;align-items:flex-start;gap:var(--spacing-sm);padding:var(--spacing-sm) var(--spacing-md);text-decoration:none;transition:background 0.15s;border-bottom:1px solid var(--border-default);"' +
                                ' onmouseover="this.style.background=\'var(--bg-body)\'" onmouseout="this.style.background=\'transparent\'">' +
                                '<span style="width:0.375rem;height:0.375rem;border-radius:50%;background:var(--color-accento);margin-top:0.375rem;flex-shrink:0;"></span>' +
                                '<div style="flex:1;min-width:0;">' +
                                '   <p style="font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(n.titulo) + '</p>' +
                                '   <p style="font-size:0.625rem;color:var(--text-muted);margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">' + escapeHtml(n.mensaje) + '</p>' +
                                '</div></a>';
                        }
                        if (notifs.length > 5) {
                            html += '<a href="/dashboard/notificaciones" style="display:block;text-align:center;padding:var(--spacing-xs) var(--spacing-md);font-size:0.625rem;color:var(--color-accento);text-decoration:none;">+' + (notifs.length - 5) + ' más</a>';
                        }
                        list.innerHTML = html;
                    } catch(e) {
                        list.innerHTML = '<div style="text-align:center;padding:var(--spacing-lg);color:var(--text-muted);font-size:var(--font-size-xs);">Error al cargar</div>';
                    }
                };
                xhr.onerror = function() {
                    var list = document.getElementById('notif-dropdown-list');
                    if (list) list.innerHTML = '<div style="text-align:center;padding:var(--spacing-lg);color:var(--text-muted);font-size:var(--font-size-xs);">Error de conexión</div>';
                };
                xhr.send();
            };

            // Actualizar contador de la campana
            function actualizarContadorBell() {
                var xhr = new XMLHttpRequest();
                xhr.open('GET', '/api/v1/notificaciones/contar', true);
                xhr.onload = function() {
                    if (xhr.status === 200) {
                        try {
                            var data = JSON.parse(xhr.responseText);
                            var count = data.noLeidas || 0;
                            var bellBadge = document.getElementById('notif-bell-count');
                            var mobileBadge = document.getElementById('mobile-notif-count');

                            if (bellBadge) {
                                if (count > 0) {
                                    bellBadge.textContent = count > 99 ? '99+' : count;
                                    bellBadge.style.display = 'flex';
                                } else {
                                    bellBadge.style.display = 'none';
                                }
                            }
                            if (mobileBadge) {
                                if (count > 0) {
                                    mobileBadge.textContent = count;
                                    mobileBadge.style.display = 'inline';
                                } else {
                                    mobileBadge.style.display = 'none';
                                }
                            }
                        } catch(e) {}
                    }
                };
                xhr.send();
            }

            function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.appendChild(document.createTextNode(t)); return d.innerHTML; }

            // Inicializar: cargar dropdown y contador
            setTimeout(function() {
                cargarNotifDropdown();
                actualizarContadorBell();
            }, 500);

            // Refrescar cada 60 segundos
            setInterval(function() {
                cargarNotifDropdown();
                actualizarContadorBell();
            }, 60000);
        })();
    </script>
</header>
</html>
