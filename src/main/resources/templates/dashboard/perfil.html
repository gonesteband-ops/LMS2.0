<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      data-theme="light">
<head th:replace="~{fragments/head :: head(titulo='Mi Perfil')}">
</head>
<body style="background:var(--bg-body);color:var(--text-primary);-webkit-font-smoothing:antialiased;">
    <header th:replace="~{fragments/header :: header}"></header>

    <div class="dashboard-layout">
        <div th:replace="~{fragments/sidebar :: sidebar(seccion='perfil')}"></div>

        <main class="dashboard-content">
            <div style="max-width:48rem;margin:0 auto;">
                <div class="dashboard-page-header animate-fade-in">
                    <div>
                        <h1 class="dashboard-page-title">Mi Perfil</h1>
                        <p style="margin-top:var(--spacing-xs);font-size:var(--font-size-sm);color:var(--text-secondary);">Información de tu cuenta y configuración personal</p>
                    </div>
                </div>

                <!-- Profile Content (loaded via XHR) -->
                <div id="perfil-content" class="card animate-slide-up">
                    <div style="text-align:center;padding:var(--spacing-2xl);">
                        <div class="spinner" style="margin:0 auto;"></div>
                        <p style="margin-top:var(--spacing-sm);font-size:var(--font-size-sm);color:var(--text-muted);">Cargando perfil...</p>
                    </div>
                </div>

                <!-- Security Section -->
                <div class="card" style="margin-top:var(--spacing-xl);">
                    <div style="display:flex;align-items:center;gap:var(--spacing-sm);padding:var(--spacing-md) var(--spacing-xl);border-bottom:1px solid var(--border-default);">
                        <svg style="width:1rem;height:1rem;color:var(--text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/></svg>
                        <h2 style="font-size:var(--font-size-sm);font-weight:700;color:var(--text-primary);">Seguridad</h2>
                    </div>
                    <div style="padding:var(--spacing-xl);display:flex;flex-direction:column;gap:var(--spacing-lg);">
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-lg);background:var(--bg-body);border-radius:var(--border-radius-xl);">
                            <div style="display:flex;align-items:flex-start;gap:var(--spacing-sm);">
                                <div style="width:2rem;height:2rem;border-radius:var(--border-radius-lg);background:rgba(245,158,11,0.1);display:flex;align-items:center;justify-content:center;color:rgba(180,83,9,1);flex-shrink:0;">
                                    <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285z"/></svg>
                                </div>
                                <div>
                                    <p style="font-size:var(--font-size-sm);font-weight:500;color:var(--text-primary);">Autenticación Multifactor (MFA)</p>
                                    <p style="font-size:var(--font-size-xs);color:var(--text-muted);">Próximamente disponible para administradores</p>
                                </div>
                            </div>
                            <span class="badge" style="background:var(--border-default);color:var(--text-secondary);">Próximamente</span>
                        </div>
                        <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-lg);background:var(--bg-body);border-radius:var(--border-radius-xl);">
                            <div style="display:flex;align-items:flex-start;gap:var(--spacing-sm);">
                                <div style="width:2rem;height:2rem;border-radius:var(--border-radius-lg);background:rgba(245,158,11,0.1);display:flex;align-items:center;justify-content:center;color:rgba(180,83,9,1);flex-shrink:0;">
                                    <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 002.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 00-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 00.75-.75 2.25 2.25 0 00-.1-.664m-5.8 0A2.251 2.251 0 0113.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25zM6.75 12h.008v.008H6.75V12zm0 3h.008v.008H6.75V15zm0 3h.008v.008H6.75V18z"/></svg>
                                </div>
                                <div>
                                    <p style="font-size:var(--font-size-sm);font-weight:500;color:var(--text-primary);">Consentimiento Informado</p>
                                    <p style="font-size:var(--font-size-xs);color:var(--text-muted);">Gestione su consentimiento según Ley 19.799</p>
                                </div>
                            </div>
                            <a href="/consentimiento" class="btn btn-ghost btn-sm">Gestionar</a>
                        </div>
                    </div>
                </div>

                <!-- Mis Cursos Section (Requerimiento #7: Pendientes con countdown, Completados con nota) -->
                <div class="card" style="margin-top:var(--spacing-xl);">
                    <div style="display:flex;align-items:center;gap:var(--spacing-sm);padding:var(--spacing-md) var(--spacing-xl);border-bottom:1px solid var(--border-default);">
                        <svg style="width:1rem;height:1rem;color:var(--text-muted);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.042A8.967 8.967 0 006 3.75c-1.052 0-2.062.18-3 .512v14.25A8.987 8.987 0 016 18c2.305 0 4.408.867 6 2.292m0-14.25a8.966 8.966 0 016-2.292c1.052 0 2.062.18 3 .512v14.25A8.987 8.987 0 0018 18a8.967 8.967 0 00-6 2.292m0-14.25v14.25"/></svg>
                        <h2 style="font-size:var(--font-size-sm);font-weight:700;color:var(--text-primary);">Mis Cursos</h2>
                    </div>
                    <div style="padding:var(--spacing-xl);" id="mis-cursos-container">
                        <!-- HTMX: carga fragmento de cursos del usuario -->
                        <div id="mis-cursos-container"
                             style="text-align:center;padding:var(--spacing-lg) 0;color:var(--text-muted);">
                            <div class="spinner" style="margin:0 auto var(--spacing-sm);"></div>
                            <p style="font-size:var(--font-size-sm);">Cargando cursos...</p>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        (function() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/v1/usuarios/me', true);
            xhr.onload = function() {
                var container = document.getElementById('perfil-content');
                if (xhr.status === 200) {
                    var u = JSON.parse(xhr.responseText);
                    container.innerHTML = '<div style="padding:var(--spacing-xl) var(--spacing-2xl);">' +
                        '<div style="display:flex;align-items:center;gap:var(--spacing-lg);margin-bottom:var(--spacing-xl);">' +
                        '   <div style="width:4rem;height:4rem;border-radius:var(--border-radius-xl);background:linear-gradient(135deg,var(--color-accento),rgba(217,119,6,1));display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:1.5rem;box-shadow:0 4px 12px rgba(245,158,11,0.3);">' + (u.nombreCompleto ? u.nombreCompleto.charAt(0).toUpperCase() : '?') + '</div>' +
                        '   <div><h3 style="font-size:var(--font-size-lg);font-weight:700;color:var(--text-primary);">' + escapeHtml(u.nombreCompleto) + '</h3><p style="font-size:var(--font-size-sm);color:var(--text-secondary);">' + escapeHtml(u.email) + '</p></div>' +
                        '</div>' +
                        '<div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--spacing-lg);">' +
                        '   <div style="padding:var(--spacing-lg);background:var(--bg-body);border-radius:var(--border-radius-xl);"><p style="font-size:var(--font-size-xs);color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Email</p><p style="font-size:var(--font-size-sm);font-weight:500;color:var(--text-primary);margin-top:var(--spacing-xs);">' + escapeHtml(u.email) + '</p></div>' +
                        '   <div style="padding:var(--spacing-lg);background:var(--bg-body);border-radius:var(--border-radius-xl);"><p style="font-size:var(--font-size-xs);color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Roles</p><p style="font-size:var(--font-size-sm);font-weight:500;color:var(--text-primary);margin-top:var(--spacing-xs);">' + (u.roles ? u.roles.join(', ') : '—') + '</p></div>' +
                        '   <div style="padding:var(--spacing-lg);background:var(--bg-body);border-radius:var(--border-radius-xl);"><p style="font-size:var(--font-size-xs);color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Consentimiento</p><p style="font-size:var(--font-size-sm);font-weight:500;margin-top:var(--spacing-xs);' + (u.consentimientoOtorgado ? 'color:var(--color-success);' : 'color:rgba(180,83,9,1);') + '">' + (u.consentimientoOtorgado ? 'Otorgado' : 'Pendiente') + '</p></div>' +
                        '   <div style="padding:var(--spacing-lg);background:var(--bg-body);border-radius:var(--border-radius-xl);"><p style="font-size:var(--font-size-xs);color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;">Miembro desde</p><p style="font-size:var(--font-size-sm);font-weight:500;color:var(--text-primary);margin-top:var(--spacing-xs);">' + (u.createdAt ? new Date(u.createdAt).toLocaleDateString('es-CL', { year: 'numeric', month: 'long', day: 'numeric' }) : '—') + '</p></div>' +
                        '</div></div>';
                } else {
                    container.innerHTML = '<div style="text-align:center;padding:var(--spacing-2xl);color:var(--color-danger);"><p>Error al cargar el perfil.</p></div>';
                }
            };
            xhr.onerror = function() {
                document.getElementById('perfil-content').innerHTML = '<div style="text-align:center;padding:var(--spacing-2xl);color:var(--color-danger);"><p>Error de conexión.</p></div>';
            };
            xhr.send();

            function escapeHtml(t) { if (!t) return ''; var d = document.createElement('div'); d.appendChild(document.createTextNode(t)); return d.innerHTML; }
        })();
    </script>

    <script>
            </script>
    <script>
        // Cargar cursos del perfil (mismo patron que notificaciones)
        (function() {
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/hx/admin/perfil/cursos', true);
            xhr.onload = function() {
                var container = document.getElementById('mis-cursos-container');
                if (!container) return;
                if (xhr.status >= 200 && xhr.status < 300) {
                    container.innerHTML = xhr.responseText;
                } else {
                    container.innerHTML = '<p style="text-align:center;color:var(--text-muted);">Error al cargar cursos.</p>';
                }
            };
            xhr.onerror = function() {
                var container = document.getElementById('mis-cursos-container');
                if (container) container.innerHTML = '<p style="text-align:center;color:var(--text-muted);">Error de conexion.</p>';
            };
            xhr.send();
        })();
    </script>
    <footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
