<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:fragment="mis-cursos">
    <th:block th:if="${inscripciones == null || inscripciones.isEmpty()}">
        <p style="text-align:center;color:var(--text-muted);padding:var(--spacing-lg) 0;">No estás inscrito en ningún curso.</p>
    </th:block>
    <th:block th:if="${inscripciones != null && !inscripciones.isEmpty()}">
        <div style="display:flex;flex-direction:column;gap:var(--spacing-sm);">
            <th:block th:each="ins : ${inscripciones}">
                <div style="display:flex;align-items:center;justify-content:space-between;padding:var(--spacing-sm) var(--spacing-md);border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);">
                    <div>
                        <span style="font-weight:600;color:var(--text-primary);" th:text="${ins.curso.titulo}">Curso</span>
                        <span style="display:block;font-size:var(--font-size-xs);color:var(--text-muted);" th:text="${ins.curso.categoria != null ? ins.curso.categoria : ''}">Categoria</span>
                    </div>
                    <div style="display:flex;align-items:center;gap:var(--spacing-sm);">
                        <span th:if="${ins.completado}" style="display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:rgba(16,185,129,0.1);border:1px solid rgba(16,185,129,0.2);border-radius:6px;font-size:0.75rem;color:var(--color-success);">
                            <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            Completado <th:block th:if="${ins.nota != null}">(<span th:text="${#numbers.formatDecimal(ins.nota, 0, 0)}">0</span>%)</th:block>
                        </span>
                        <span th:unless="${ins.completado}" style="font-size:var(--font-size-xs);color:var(--text-muted);">
                            <th:block th:if="${ins.fechaLimite != null}">
                                Restan <span th:text="${#dates.format(ins.fechaLimite, 'dd/MM')}">00/00</span>
                            </th:block>
                            <th:block th:unless="${ins.fechaLimite != null}">Pendiente</th:block>
                        </span>
                    </div>
                </div>
            </th:block>
        </div>
    </th:block>
</div>
</html>
