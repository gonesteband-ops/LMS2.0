    <script>
        (function() {
            // Detectar si hay documentos de video y mostrar badge multimedia
            var xhr = new XMLHttpRequest();
            xhr.open('GET', '/api/v1/documentos', true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    try {
                        var docs = JSON.parse(xhr.responseText);
                        var videos = docs.filter(function(d) {
                            var mt = (d.mimeType || '').toLowerCase();
                            return mt.indexOf('video/') === 0;
                        });
                        if (videos.length > 0) {
                            // infoBar removed
                                document.getElementById('video-count').textContent = videos.length;
                                infoBar.style.display = 'block';
                            }
                        }
                    } catch(e) {}
                }
            };
            xhr.send();
        })();
