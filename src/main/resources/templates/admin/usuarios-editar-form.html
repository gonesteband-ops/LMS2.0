<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Usuario - Fragmento</title>
</head>
<body>
<div th:fragment="editar-usuario-form">
    <div style="padding:var(--spacing-xl);">
        <form th:action="'/hx/admin/usuarios/editar/' + ${usuario.id}"
              th:attr="hx-post='/hx/admin/usuarios/editar/' + ${usuario.id}"
              hx-target="#usuarios-list"
              hx-swap="innerHTML"
              style="display:flex;flex-direction:column;gap:var(--spacing-md);">

            <!-- Mensaje de error -->
            <div th:if="${error != null}"
                 style="padding:var(--spacing-sm) var(--spacing-md);border-radius:var(--border-radius-lg);background:rgba(239,68,68,0.06);border:1px solid rgba(239,68,68,0.2);color:var(--color-danger);font-size:var(--font-size-xs);font-weight:500;">
                <span th:text="${error}">Error</span>
            </div>

            <div style="display:grid;gap:var(--spacing-md);grid-template-columns:1fr 2fr 2fr;">
                <!-- RUT -->
                <div>
                    <label for="edit-rut" style="display:block;font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin-bottom:var(--spacing-xs);">
                        RUT
                    </label>
                    <div style="position:relative;">
                        <input type="text"
                               id="edit-rut"
                               name="rut"
                               th:value="${editRequest?.rut != null ? editRequest.rut : usuario.rut}"
                               maxlength="20"
                               placeholder="Ej: 12.345.678-9"
                               style="width:100%;padding:var(--spacing-sm) var(--spacing-md);border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-size-sm);outline:none;transition:border-color 0.2s;box-sizing:border-box;">
                    </div>
                </div>

                <!-- Nombre Completo -->
                <div>
                    <label for="edit-nombreCompleto" style="display:block;font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin-bottom:var(--spacing-xs);">
                        Nombre Completo <span style="color:var(--color-danger);">*</span>
                    </label>
                    <div style="position:relative;">
                        <input type="text"
                               id="edit-nombreCompleto"
                               name="nombreCompleto"
                               th:value="${editRequest?.nombreCompleto != null ? editRequest.nombreCompleto : usuario.nombreCompleto}"
                               required
                               minlength="3"
                               maxlength="255"
                               style="width:100%;padding:var(--spacing-sm) var(--spacing-md);border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-size-sm);outline:none;transition:border-color 0.2s;box-sizing:border-box;">
                    </div>
                </div>

                <!-- Email -->
                <div>
                    <label for="edit-email" style="display:block;font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin-bottom:var(--spacing-xs);">
                        Email <span style="color:var(--color-danger);">*</span>
                    </label>
                    <div style="position:relative;">
                        <input type="email"
                               id="edit-email"
                               name="email"
                               th:value="${editRequest?.email != null ? editRequest.email : usuario.email}"
                               required
                               style="width:100%;padding:var(--spacing-sm) var(--spacing-md);border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-size-sm);outline:none;transition:border-color 0.2s;box-sizing:border-box;">
                    </div>
                </div>
            </div>

            <div style="display:grid;gap:var(--spacing-md);grid-template-columns:1fr 1fr;">
                <!-- Contraseña (opcional) -->
                <div>
                    <label for="edit-password" style="display:block;font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin-bottom:var(--spacing-xs);">
                        Nueva Contraseña <span style="color:var(--text-muted);font-weight:400;">(opcional)</span>
                    </label>
                    <div style="position:relative;">
                        <input type="password"
                               id="edit-password"
                               name="password"
                               autocomplete="new-password"
                               minlength="12"
                               placeholder="Dejar vacío para mantener"
                               style="width:100%;padding:var(--spacing-sm) var(--spacing-md);padding-right:2.5rem;border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-size-sm);outline:none;transition:border-color 0.2s;box-sizing:border-box;">
                        <button type="button" onclick="togglePasswordVisibilidad('edit-password', this)"
                                style="position:absolute;right:0.375rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0.25rem;display:flex;align-items:center;justify-content:center;color:var(--text-muted);border-radius:var(--border-radius-md);transition:color 0.15s;"
                                onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'"
                                aria-label="Mostrar contraseña"
                                title="Mostrar/ocultar contraseña"
                                id="btn-show-pass">
                            <svg class="eye-open" style="width:1.25rem;height:1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <svg class="eye-closed" style="width:1.25rem;height:1.25rem;display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                        </button>
                    </div>
                </div>

                <!-- Confirmar Contraseña -->
                <div>
                    <label for="edit-confirmarPassword" style="display:block;font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin-bottom:var(--spacing-xs);">
                        Confirmar Contraseña
                    </label>
                    <div style="position:relative;">
                        <input type="password"
                               id="edit-confirmarPassword"
                               name="confirmarPassword"
                               autocomplete="new-password"
                               minlength="12"
                                placeholder="Repite la nueva contraseña"
                                 style="width:100%;padding:var(--spacing-sm) var(--spacing-md);padding-right:2.5rem;border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-size-sm);outline:none;transition:border-color 0.2s;box-sizing:border-box;">
                        <button type="button" onclick="togglePasswordVisibilidad('edit-confirmarPassword', this)"
                                style="position:absolute;right:0.375rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0.25rem;display:flex;align-items:center;justify-content:center;color:var(--text-muted);border-radius:var(--border-radius-md);transition:color 0.15s;"
                                onmouseover="this.style.color='var(--text-primary)'" onmouseout="this.style.color='var(--text-muted)'"
                                aria-label="Mostrar contraseña"
                                title="Mostrar/ocultar contraseña">
                            <svg class="eye-open" style="width:1.25rem;height:1.25rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <svg class="eye-closed" style="width:1.25rem;height:1.25rem;display:none;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88"/></svg>
                        </button>
                     </div>
                 </div>
             </div>

            <!-- Rol -->
            <div style="max-width:20rem;">
                <label for="edit-rolId" style="display:block;font-size:var(--font-size-xs);font-weight:600;color:var(--text-primary);margin-bottom:var(--spacing-xs);">
                    Rol <span style="color:var(--color-danger);">*</span>
                </label>
                <div style="position:relative;">
                    <select id="edit-rolId"
                            name="rolId"
                            required
                            style="width:100%;padding:var(--spacing-sm) var(--spacing-md);border:1px solid var(--border-default);border-radius:var(--border-radius-lg);background:var(--bg-surface);color:var(--text-primary);font-size:var(--font-size-sm);outline:none;transition:border-color 0.2s;cursor:pointer;box-sizing:border-box;appearance:auto;">
                        <option value="">Seleccionar rol...</option>
                        <option th:each="rol : ${roles}"
                                th:value="${rol.id}"
                                th:text="${rol.nombre}"
                                th:selected="${editRequest?.rolId != null ? editRequest.rolId == rol.id : usuario.roles.iterator().next().id == rol.id}">
                            ADMIN
                        </option>
                    </select>
                </div>
            </div>

            <!-- Botones -->
            <div style="display:flex;align-items:center;gap:var(--spacing-md);padding-top:var(--spacing-sm);border-top:1px solid var(--border-default);">
                <button type="submit" class="btn btn-accent btn-sm"
                        style="display:inline-flex;align-items:center;gap:var(--spacing-sm);">
                    <svg style="width:1rem;height:1rem;" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.5 12.75l6 6 9-13.5"/>
                    </svg>
                    Guardar Cambios
                </button>
                <button type="button" class="btn btn-ghost btn-sm"
                        onclick="cancelarEdicion()"
                        style="display:inline-flex;align-items:center;gap:var(--spacing-sm);">
                    Cancelar
                </button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
