# Configuración principal del Sistema LMS LegalTech
server:
  port: ${PORT:8080}

spring:
  application:
    name: lms-legaltech

  # Base de datos PostgreSQL
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/lms_db}
    username: ${DB_USERNAME:lms_user}
    password: ${DB_PASSWORD:cambiar_esto}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
        format_sql: true

  # Flyway (migraciones)
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Thymeleaf (templates HTML)
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false

  # Redis (caché y cola) - configurable via variables de entorno
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 2000ms

  # Archivos
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  # Mail (notificaciones - Fase 2)
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false

# JWT
app:
  cookie:
    secure: ${COOKIE_SECURE:false}
  jwt:
    secret: ${JWT_SECRET:}
    access-token-expiration: 900000    # 15 minutos en ms
    refresh-token-expiration: 604800000  # 7 días en ms
  minio:
    endpoint: ${B2_ENDPOINT:https://s3.us-east-005.backblazeb2.com}
    access-key: ${B2_KEY_ID:}
    secret-key: ${B2_APP_KEY:}
    bucket-name: ${B2_BUCKET_NAME:lms-archivos}
  mfa:
    issuer: LMS-LegalTech
  bcrypt:
    rounds: 12

  # Notificaciones automáticas
  notificaciones:
    umbral-meses-sin-actualizar: 6
    cron-vencimientos: 0 0 2 * * ?
    cron-limpieza: 0 0 3 * * ?
    cron-reporte-semanal: 0 0 8 * * MON

  # Breach detection y notificación
  breach:
    email-to: ${BREACH_NOTIFICATION_EMAIL:dpo@example.com}
    grace-period-days: 30

  # Auditoría cleanup schedules
  auditoria:
    cron-limpieza: 0 0 4 * * ?
    cron-limpieza-eliminacion: 0 0 5 * * ?

# Logging
logging:
  level:
    root: INFO
    com.lms: DEBUG
    org.springframework.security: INFO
    org.hibernate: WARN

# Actuator / OpenTelemetry
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# Configuración por entorno
---
spring:
  config:
    activate:
      on-profile: development
logging:
  level:
    com.lms: DEBUG
    org.hibernate.SQL: DEBUG
spring.jpa.hibernate.ddl-auto: update

---

spring:
  config:
    activate:
      on-profile: production
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 3
    repair-on-migrate: true
    validate-on-migrate: false
app:
  cookie:
    secure: ${COOKIE_SECURE:true}
  cifrado:
    secret-key: ${CIFRADO_SECRET_KEY:}
  ssl:
    enabled: ${SSL_ENABLED:false}
logging:
  level:
    com.lms: WARN
    org.flywaydb: INFO
spring.thymeleaf.cache: false
spring.jpa.hibernate.ddl-auto: none
spring.security.csrf.multipart.enabled: false

---
spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:lms_test;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
logging:
  level:
    com.lms: DEBUG
