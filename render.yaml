services:
  - type: web
    name: lms-legaltech
    env: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    port: 8080
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: jdbc:postgresql://<host>/<db>?sslmode=require
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SPRING_PROFILES_ACTIVE
        value: production
      - key: JAVA_OPTS
        value: -Xmx256m
      - key: PORT
        value: 8080
